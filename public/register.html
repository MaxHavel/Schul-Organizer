<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrieren – Schul-Organizer</title>
</head>
<body>
  <h1>Registrieren</h1>
  <form id="register-form">
    <label>Benutzername (wird anderen angezeigt) <input name="username" minlength="3" maxlength="30" required></label><br>
    <label>E-Mail <input name="email" type="email" required></label><br>
    <label>Klasse <input name="klasse" placeholder="z. B. 3AHWII"></label><br>
    <label>Passwort <input name="password" type="password" minlength="8" required></label><br>
    <button type="submit">Konto anlegen</button>
  </form>
  <p id="message"></p>
  <p>Schon registriert? <a href="login.html">Login</a></p>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('POST', '/api/auth/register', formToObject(e.target));
        location.href = 'dashboard.html';
      } catch (err) {
        document.getElementById('message').textContent = err.message;
      }
    });
  </script>
</body>
</html>
